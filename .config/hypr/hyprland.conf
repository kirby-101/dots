# ~/.config/hypr/hyprland.conf kirby@bsdlab

#
# Variables
#

# Monitors
monitor = 0, 1920x1080@60, 0x0, 1
monitor = 1, 1920x1200@60, 1920x0, 1

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_RUNTIME_DIR, /var/run/xdg/kirby

# Set programs that you use
$terminal = footclient
$menu = wofi --show run
$screenshot = grimshot copy area
$editor = emacs


#
# Window & Workspace Rules
#

# Workspaces
workspace = 1, monitor:0, persistent:true, default:true
workspace = 2, monitor:0, persistent:true
workspace = 3, monitor:0, persistent:true
workspace = 4, monitor:0, persistent:true
workspace = 5, monitor:0, persistent:true
workspace = 6, monitor:1, persistent:true, default:true
workspace = 7, monitor:1, persistent:true
workspace = 8, monitor:1, persistent:true
workspace = 9, monitor:1, persistent:true
workspace = 10, monitor:1, persistent:true

#
# Autostart in Workspace
#
exec-once = [workspace 1]  emacs ~/Workspace/Todo.md 
exec-once = [workspace 2 silent] firefox
#exec-once = [workspace 3 silent] signal-desktop
exec-once = [workspace 4 silent] thunderbird
#exec-once = [workspace 5 silent] 
#exec-once = [workspace 6 silent]
#exec-once = [workspace 3 silent]
#exec-once = [workspace 3 silent]
#exec-once = [workspace 3 silent]
#exec-once = [workspace 3 silent] 

#
# Autostart 
#
exec-once = dbus-launch waybar &
exec-once = hyprpaper &
exec-once = dbus-launch emacs --fg-daemon &
exec-once = dbus-launch dunst &
exec-once = dbus-launch pulseaudio --start &
exec-once = dbus-launch foot --server &
exec-once = ssh-agent -a $XDG_RUNTIME_DIR/ssh-agent.sock

# cliphist
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &


#
# Key-Bindings
#

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER                            # Sets "Windows" key as main modifier

# https://wiki.hyprland.org/Configuring/Binds/

# Programs
bind = $mainMod, RETURN, exec, $terminal    # Terminal
bind = $mainMod, SPACE, exec, $menu         # dmenu
bind = $mainMod, P, exec, $fileManager      # FileManager
#mod+shift+c:SIGUSR1 an DE
bind = $mainMod SHIFT, S, execr, $screenshot  # Screenshot
bind = $mainMod, E, exec, $editor             # Editor

# cliphist
bind = SUPER, V, exec, cliphist list | wofi --show dmenu | cliphist decode | wl-copy

# WM Control
bind = $mainMod ALT, q, exit                    # Quit
bind = $mainMod, W, killactive                  # Close Active Window
bind = $mainMod SHIFT, W, forcekillactive       # Kill Active Window
bind = $mainMod, F, fullscreen                  # Fullscreen Active Window
#Window States... (sticky,floating,pinned,etc)

# Navigation
bind = $mainMod, h, movefocus, l            # Move Focus left
bind = $mainMod, l, movefocus, r            # Move Focus right
bind = $mainMod, j, movefocus, d            # Move Focus down
bind = $mainMod, k, movefocus, u            # Move Focus up

bind = $mainMod SHIFT, h, movewindow, l     # Move Window left
bind = $mainMod SHIFT, l, movewindow, r     # Move Window right
bind = $mainMod SHIFT, j, movewindow, d     # Move Window down
bind = $mainMod SHIFT, k, movewindow, u     # Move Window up

bindm = $mainMod, mouse:272, movewindow     # Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1            # Switch Workspace Focus
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1    # Move Window to Workspace
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Audio
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

#XF86AudioPrev
#XF86AudioNext
#XF86AudioPlay
# lookup xkbcommon-keysyms.h header
#bind = SUPER, code:28, exec, amongus


#
# Configuring
#

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 3
    gaps_out = 15

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(817f7f)
    col.inactive_border = rgb(30302f)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    #drop_shadow = false
    #shadow_range = 1
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 10
        passes = 1
	brightness = 0.7
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    #vfr = true
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    font_family = Fira Code
}

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    kb_options = ctrl:nocaps

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

render {
    direct_scanout = false
}

xwayland {
    force_zero_scaling = true
}
